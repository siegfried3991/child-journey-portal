name: Publish verified source snapshot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-source.yml
permissions:
  contents: write
jobs:
  publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Expand the checked source archive
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          archive=Path('Child-Journey-Portal-GitHub-source.zip')
          expected='4e4d940cf62e793f911d1578a26085e167d43c926bd13076a4784b51dccf203a'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected, 'Archive checksum mismatch'
          with zipfile.ZipFile(archive) as bundle:
              files=[i for i in bundle.infolist() if not i.is_dir()]
              assert len(files)==156, 'Unexpected source count'
              for item in files:
                  path=PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in {'.git','node_modules','.wrangler','.sites-runtime','dist'}
                  assert (item.external_attr >> 16) & 0o170000 != 0o120000, 'Symlink not allowed'
                  target=Path(*path.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(bundle.read(item))
                  target.chmod(((item.external_attr >> 16) & 0o777) or 0o644)
          print('Verified and expanded 156 source files.')
          PYTHON
      - name: Commit the source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Source tree already matches the verified snapshot."
            exit 0
          fi
          git commit -m "Publish verified Student ERP source, research and tests"
          git push origin HEAD:main
