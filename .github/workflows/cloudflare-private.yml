name: Deploy complete private portal
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-private-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
      ERP_OWNER_EMAILS: ${{ secrets.ERP_OWNER_EMAILS }}
      ERP_WORKSPACE_ID: ${{ secrets.ERP_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/cloudflare/configure.mjs
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: node --test verification/domain.test.mjs
      - run: npm run cloudflare:build
      - run: npx wrangler d1 migrations apply DB --remote --config .cloudflare/wrangler.json
      - run: npx wrangler deploy --config dist/server/wrangler.json
